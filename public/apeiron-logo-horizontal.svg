<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" fill="none">
  <defs>
    <!-- Emblem Gradients -->
    <linearGradient id="hPurpleRim" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stopColor="#9C52FD" />
      <stop offset="50%" stopColor="#7022FC" />
      <stop offset="100%" stopColor="#4A148C" />
    </linearGradient>

    <linearGradient id="hOrangeRim" x1="100%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stopColor="#FFE082" />
      <stop offset="50%" stopColor="#FDBF32" />
      <stop offset="100%" stopColor="#E65100" />
    </linearGradient>

    <linearGradient id="hMetallicLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="35%" stopColor="#CBD5E1" />
      <stop offset="70%" stopColor="#64748B" />
      <stop offset="100%" stopColor="#1E293B" />
    </linearGradient>

    <linearGradient id="hMetallicRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="35%" stopColor="#E2E8F0" />
      <stop offset="70%" stopColor="#64748B" />
      <stop offset="100%" stopColor="#0F172A" />
    </linearGradient>

    <linearGradient id="wordmarkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="85%" stopColor="#E2E8F0" />
      <stop offset="100%" stopColor="#CBD5E1" />
    </linearGradient>

    <filter id="hGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Ambient Halos -->
  <circle cx="28" cy="40" r="22" fill="#7022FC" opacity="0.3" filter="url(#hGlow)" />
  <circle cx="56" cy="40" r="22" fill="#FDBF32" opacity="0.25" filter="url(#hGlow)" />

  <!-- Geometric Shield Emblem Group (scaled & positioned at x=8, y=6) -->
  <g transform="translate(8, 6) scale(0.68)">
    <!-- Outer Shield Left Facet with Purple Rim -->
    <polygon
      points="50,6 18,22 18,58 50,94 50,86 24,54 24,26 50,14"
      fill="url(#hPurpleRim)"
      opacity="0.95"
    />
    <!-- Outer Shield Right Facet with Orange Rim -->
    <polygon
      points="50,6 82,22 82,58 50,94 50,86 76,54 76,26 50,14"
      fill="url(#hOrangeRim)"
      opacity="0.95"
    />
    <!-- Inner Dark Void Foundation -->
    <polygon points="50,14 24,26 24,54 50,86 76,54 76,26" fill="#040408" />
    <!-- The Angular 'A' Wings -->
    <polygon points="50,18 42,24 28,68 37,70 44,46 50,46" fill="url(#hMetallicLeft)" />
    <polygon points="50,18 58,24 72,68 63,70 56,46 50,46" fill="url(#hMetallicRight)" />
    <!-- Apex Ridge -->
    <polygon points="50,18 48,22 48,46 52,46 52,22" fill="#FFFFFF" />
    <!-- Crossbar -->
    <polygon points="38,54 62,54 60,60 40,60" fill="#E2E8F0" />
    <line x1="39" y1="54" x2="61" y2="54" stroke="#FFFFFF" strokeWidth="1.2" />
    <!-- Core Diamond -->
    <polygon points="50,30 46,38 50,44 54,38" fill="#020204" stroke="#E2E8F0" strokeWidth="0.8" />
    <!-- Rim lines -->
    <line x1="50" y1="6" x2="18" y2="22" stroke="#D8B4FE" strokeWidth="1.5" />
    <line x1="50" y1="6" x2="82" y2="22" stroke="#FED7AA" strokeWidth="1.5" />
    <line x1="18" y1="22" x2="18" y2="58" stroke="#7022FC" strokeWidth="1.2" />
    <line x1="82" y1="22" x2="82" y2="58" stroke="#FDBF32" strokeWidth="1.2" />
    <line x1="18" y1="58" x2="50" y2="94" stroke="#7022FC" strokeWidth="1.5" />
    <line x1="82" y1="58" x2="50" y2="94" stroke="#FDBF32" strokeWidth="1.5" />
  </g>

  <!-- Wordmark "APEIRON" -->
  <text
    x="88"
    y="44"
    fill="url(#wordmarkGrad)"
    font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif"
    font-size="32"
    font-weight="800"
    letter-spacing="0.22em"
  >
    APEIRON
  </text>

  <!-- Subheading "FRONTIER SECURITY" -->
  <text
    x="90"
    y="64"
    fill="#94A3B8"
    font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif"
    font-size="11"
    font-weight="600"
    letter-spacing="0.32em"
  >
    FRONTIER SECURITY
  </text>
</svg>
